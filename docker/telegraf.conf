# docker/telegraf.conf
# ---------------------
# Telegraf pipeline: MQTT → InfluxDB
# Subscribes to all simulator topics and writes each message as a
# "vitals" measurement in InfluxDB.

[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

# ---------------------------------------------------------------------------
# INPUT: MQTT consumer
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["iots/#"]
  qos     = 1

  # Parse each message as JSON
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "vitals"

    # Numeric fields — written as InfluxDB field values
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sequence_number"
      type = "int"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fault_active"
      type = "bool"
      optional = true

    # String fields — phase/condition/quality stored as fields so Grafana
    # stat panels can query them via |> filter(fn: (r) => r["_field"] == "phase")
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "phase"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "condition"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "quality"
      type = "string"
      optional = true

    # Tags — indexed, used for filtering in Grafana queries
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sensor_name"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "persona_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "poc_type"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"
      optional = true

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "unit"
      optional = true

# ---------------------------------------------------------------------------
# OUTPUT: InfluxDB v2
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "my-token"
  organization = "iot_org"
  bucket       = "iot_poc"
