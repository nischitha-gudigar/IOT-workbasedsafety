apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb-vitals
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      version: Flux
      organization: iot_org
      defaultBucket: iot_poc
      httpMode: POST
      tlsSkipVerify: true
    secureJsonData:
      token: my-token
