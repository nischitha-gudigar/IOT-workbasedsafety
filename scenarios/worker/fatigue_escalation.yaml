# scenarios/worker/fatigue_escalation.yaml
# Worker gradually fatigues over an 8-hour shift.
# Posture degrades, HR climbs, ends with a fall event.

schema_version: "1.0"
scenario_id: fatigue_escalation
description: "Worker gradually fatigues over an 8-hour shift, posture degrades, ends with safety alert"
persona: welder_factory
poc_type: worker_safety

# Total simulated duration in minutes (8 hours = 480 minutes)
total_duration_minutes: 480

# Time compression: 60 means 1 real second = 1 simulated minute
# 480 simulated minutes / 60 = 8 real minutes for the full scenario
compression: 60

# Worker context affects how tight the safety thresholds are
worker_context:
  shift_day: 4              # day 4 of 5 — thresholds are tighter
  consecutive_days: 4
  recent_medical_leave: false

# ---------------------------------------------------------------------------
# Phases — how sensor values evolve over the shift
# start_minute and end_minute are in SIMULATED minutes
# ---------------------------------------------------------------------------
phases:
  - name: normal_work
    start_minute: 0
    end_minute: 180
    sensors:
      heart_rate:
        min: 65
        max: 80
        behavior: oscillating_stable
      skin_temperature:
        min: 36.2
        max: 36.8
        behavior: oscillating_stable
      posture_angle:
        min: 8
        max: 22
        behavior: oscillating_stable
      accel_magnitude:
        min: 0.9
        max: 1.2
        behavior: oscillating_stable
    noise_intensity: low
    activity: walking

  - name: early_fatigue
    start_minute: 180
    end_minute: 360
    sensors:
      heart_rate:
        min: 78
        max: 95
        behavior: monotonic_rising
      skin_temperature:
        min: 36.6
        max: 37.3
        behavior: monotonic_rising
      posture_angle:
        min: 18
        max: 38
        behavior: monotonic_rising
      accel_magnitude:
        min: 0.9
        max: 1.3
        behavior: oscillating_stable
    noise_intensity: medium
    activity: walking

  - name: heavy_fatigue
    start_minute: 360
    end_minute: 480
    sensors:
      heart_rate:
        min: 90
        max: 112
        behavior: monotonic_rising
      skin_temperature:
        min: 37.1
        max: 38.2
        behavior: monotonic_rising
      posture_angle:
        min: 30
        max: 52
        behavior: monotonic_rising
      accel_magnitude:
        min: 0.8
        max: 1.4
        behavior: oscillating_stable
    noise_intensity: high
    activity: bending

# ---------------------------------------------------------------------------
# Events — scripted moments that override phase briefly then return
# at_minute is in SIMULATED minutes
# ---------------------------------------------------------------------------
events:
  - at_minute: 310
    type: posture_spike
    description: "Worker bends sharply to pick up heavy object"
    overrides:
      posture_angle: 68
    duration_seconds: 45       # real seconds the override lasts

  - at_minute: 430
    type: inactivity
    description: "Worker stops moving — possible rest or fatigue collapse"
    overrides:
      accel_magnitude: 0.02
    duration_seconds: 130

  - at_minute: 470
    type: fall
    description: "Worker loses balance"
    overrides:
      accel_magnitude: 4.2     # g-force spike
    duration_seconds: 3
