# scenarios/worker/normal_shift.yaml
# A fully normal 8-hour shift with no incidents.
# Useful as a baseline demo and system verification scenario.

schema_version: "1.0"
scenario_id: normal_shift
description: "Normal uneventful 8-hour shift — healthy worker, no alerts"
persona: welder_factory
poc_type: worker_safety

total_duration_minutes: 480
compression: 60

worker_context:
  shift_day: 1
  consecutive_days: 1
  recent_medical_leave: false

phases:
  - name: morning_start
    start_minute: 0
    end_minute: 60
    sensors:
      heart_rate:
        min: 62
        max: 75
        behavior: oscillating_stable
      skin_temperature:
        min: 36.1
        max: 36.7
        behavior: oscillating_stable
      posture_angle:
        min: 5
        max: 18
        behavior: oscillating_stable
      accel_magnitude:
        min: 0.85
        max: 1.15
        behavior: oscillating_stable
    noise_intensity: low
    activity: walking

  - name: active_work
    start_minute: 60
    end_minute: 240
    sensors:
      heart_rate:
        min: 68
        max: 85
        behavior: oscillating_stable
      skin_temperature:
        min: 36.3
        max: 36.9
        behavior: oscillating_stable
      posture_angle:
        min: 8
        max: 25
        behavior: oscillating_stable
      accel_magnitude:
        min: 0.9
        max: 1.3
        behavior: oscillating_stable
    noise_intensity: low
    activity: walking

  - name: post_lunch
    start_minute: 240
    end_minute: 300
    sensors:
      heart_rate:
        min: 62
        max: 72
        behavior: oscillating_stable
      skin_temperature:
        min: 36.2
        max: 36.7
        behavior: oscillating_stable
      posture_angle:
        min: 5
        max: 15
        behavior: oscillating_stable
      accel_magnitude:
        min: 0.8
        max: 1.1
        behavior: oscillating_stable
    noise_intensity: low
    activity: standing

  - name: afternoon_work
    start_minute: 300
    end_minute: 480
    sensors:
      heart_rate:
        min: 68
        max: 84
        behavior: oscillating_stable
      skin_temperature:
        min: 36.3
        max: 36.9
        behavior: oscillating_stable
      posture_angle:
        min: 8
        max: 24
        behavior: oscillating_stable
      accel_magnitude:
        min: 0.9
        max: 1.3
        behavior: oscillating_stable
    noise_intensity: low
    activity: walking

events: []
